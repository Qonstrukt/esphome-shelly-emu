esphome:
  name: shelly-emu-test
esp32:
  board: esp32dev
  framework:
    type: esp-idf
wifi:
  ssid: "testnet"
  password: "testpassword"
logger:
api:
  homeassistant_services: true
external_components:
  - source:
      type: local
      path: ../components
    components: [shelly_emu]
switch:
  - platform: homeassistant
    id: ha_sw0
    entity_id: switch.test0
  - platform: homeassistant
    id: ha_sw1
    entity_id: switch.test1
sensor:
  - platform: homeassistant
    id: ha_p0
    entity_id: sensor.test_power0
  - platform: homeassistant
    id: ha_e0
    entity_id: sensor.test_energy0
shelly_emu:
  model: pro2pm
  name: "Test"
  switches:
    - switch: ha_sw0
      name: "Channel 0"
      power: ha_p0
      energy: ha_e0
    - switch: ha_sw1
