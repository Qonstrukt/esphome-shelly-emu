# Emulates a Shelly Pro 2PM with two channels whose state and power come from
# Home Assistant. Pair it in mySigen via "Add device" -> "Smart Load" -> "WLAN Network".
#
# Replace the entity_ids with your own. Any ESPHome switch/sensor works as a source,
# not only the homeassistant platform.
substitutions:
  name: shelly-emu-pro2pm

esphome:
  name: ${name}
  friendly_name: Shelly emu Pro 2PM

esp32:
  board: esp32dev
  framework:
    type: esp-idf

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

logger:

api:
  # Needed so the node may call switch.turn_on/off in Home Assistant.
  # Also tick "Allow the device to perform Home Assistant actions" in the
  # ESPHome integration options for this node.
  homeassistant_services: true

ota:
  - platform: esphome

external_components:
  - source:
      type: local
      path: ../components
    components: [shelly_emu]
  # or, from GitHub:
  # - source: github://Qonstrukt/shelly-emu
  #   components: [shelly_emu]

switch:
  - platform: homeassistant
    id: ha_boiler
    entity_id: switch.boiler
  - platform: homeassistant
    id: ha_heat_pump
    entity_id: switch.heat_pump

sensor:
  - platform: homeassistant
    id: ha_boiler_power
    entity_id: sensor.boiler_power
  - platform: homeassistant
    id: ha_boiler_energy
    entity_id: sensor.boiler_energy
  - platform: homeassistant
    id: ha_heat_pump_power
    entity_id: sensor.heat_pump_power

shelly_emu:
  model: pro2pm
  name: "Shelly emu"
  switches:
    - switch: ha_boiler
      name: "Boiler"
      power: ha_boiler_power
      energy: ha_boiler_energy   # kWh by default, see energy_unit
    - switch: ha_heat_pump
      name: "Heat pump"
      power: ha_heat_pump_power  # no energy sensor: energy is integrated from power
